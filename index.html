<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>آرام تاکسی | خدمات تاکسی فرودگاه</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Vazirmatn', 'sans-serif'],
          },
          colors: {
            primary: '#FFC107',
            background: '#121212',
            card: '#1E1E1E',
            success: '#4CAF50',
            warning: '#FF9800',
            danger: '#F44336',
            text: '#FFFFFF',
            secondary: '#BDBDBD',
          },
          spacing: {
            'safe-top': 'env(safe-area-inset-top)',
            'safe-bottom': 'env(safe-area-inset-bottom)',
            'safe-left': 'env(safe-area-inset-left)',
            'safe-right': 'env(safe-area-inset-right)',
          },
          borderRadius: {
            'card': '20px',
            'button': '16px',
          },
          minHeight: {
            'card': '110px',
            'input': '56px',
            'button': '56px',
            'list-item': '64px',
          }
        },
      },
    };
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap');

    html, body, #root, * {
      font-family: 'Vazirmatn', sans-serif;
    }

    html {
      font-size: 16px;
      overflow-x: hidden;
    }

    body {
      font-family: 'Vazirmatn', sans-serif;
      background-color: #121212;
      color: #FFFFFF;
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
      padding-bottom: env(safe-area-inset-bottom);
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }

    /* Samsung One UI Typography Scale */
    .text-page-title { font-size: 28px; font-weight: 700; }
    .text-section-title { font-size: 22px; font-weight: 600; }
    .text-card-title { font-size: 18px; font-weight: 600; }
    .text-body { font-size: 16px; }
    .text-min { font-size: 14px; }
    .text-important { font-size: 32px; font-weight: 700; }
    .text-important-lg { font-size: 40px; font-weight: 700; }

    /* Samsung One UI Card */
    .card-oneui {
      background-color: #1E1E1E;
      border-radius: 20px;
      padding: 16px;
      min-height: 110px;
    }

    /* Samsung One UI Button */
    .btn-oneui {
      width: 100%;
      height: 56px;
      border-radius: 16px;
      font-weight: 700;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .btn-oneui-primary {
      background-color: #FFC107;
      color: #121212;
    }

    .btn-oneui-primary:hover {
      background-color: #FFB300;
    }

    /* Samsung One UI Input */
    .input-oneui {
      width: 100%;
      min-height: 56px;
      padding: 16px;
      background-color: #1E1E1E;
      border: 1px solid #333333;
      border-radius: 16px;
      color: #FFFFFF;
      font-size: 16px;
    }

    .input-oneui:focus {
      outline: none;
      border-color: #FFC107;
    }

    .input-oneui::placeholder {
      color: #BDBDBD;
    }

    /* Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #1E1E1E;
    }

    ::-webkit-scrollbar-thumb {
      background: #333333;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #444444;
    }

    /* Safe area utilities */
    .pt-safe { padding-top: env(safe-area-inset-top); }
    .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
    .pl-safe { padding-left: env(safe-area-inset-left); }
    .pr-safe { padding-right: env(safe-area-inset-right); }
  </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh.com/react@^19.2.0/",
    "react": "https://esm.sh.com/react@^19.2.0",
    "react-dom/": "https://esm.sh.com/react-dom@^19.2.0/"
  }
}
</script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
